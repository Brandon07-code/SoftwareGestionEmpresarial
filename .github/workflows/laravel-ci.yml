name: Turnix ERP - Integración Continua (CI)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  code-style:
    name: 🎨 Calidad de Código (Laravel Pint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, zip, gd
          coverage: none

      - name: Cache de dependencias Composer
        uses: actions/cache@v4
        with:
          path: src/vendor
          key: ${{ runner.os }}-composer-pint-${{ hashFiles('src/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-pint-

      - name: Instalar dependencias de Composer
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Ejecutar verificación de estilo (Laravel Pint / PSR-12)
        run: ./vendor/bin/pint --test

  automated-tests:
    name: 🧪 Pruebas Unitarias e Integración (PHPUnit)
    needs: code-style
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, zip, gd, pdo, sqlite, pdo_sqlite, bcmath
          coverage: none

      - name: Cache de dependencias Composer
        uses: actions/cache@v4
        with:
          path: src/vendor
          key: ${{ runner.os }}-composer-tests-${{ hashFiles('src/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-tests-

      - name: Instalar dependencias de Composer
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Preparar archivo de entorno (.env)
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Ejecutar Suite Completa de Pruebas Automatizadas
        run: php artisan test --without-tty
